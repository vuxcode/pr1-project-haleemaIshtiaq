<meta name="color-scheme" content="dark">
<h1  style="text-align:center; color:blue;" > HANGMAN GAME</h1>

<h1 id="welcomeMessage" ; style="text-align:center;"><br><br>Welcome to play <span style="color:blue;">HANGMAN</span>  word guessing game<br><br></h1>
<center>
<button id="timeBased" style="color:red;cursor:pointer;"><span style=" font-size:20px;">Time based game</span><br> Time linmit 2 minutes</button>
<button id="withoutTime" style="color:red;cursor:pointer;"><span style=" font-size:20px;">Without Time</span> <br>No time limit</button>
</center>
<div id="randomWord" style="text-align:center;"></div>
<div id="hint" style="display:none;text-align:center;">
 <button id="hintButton" style="padding:10px;color:yellow;cursor:pointer;display:block;margin:auto;">Hint</button>
 <div id="hintText"></div>
</div>
 <div id="alphabets" style="text-align:center;" ></div>
<div id="finalMessage" style="text-align:center;" ></div>
<div id="chancesMessage" style="display:none; position:absolute; top:250px; left:80px;" ></div>
<div id="words"  style="display:none; position:absolute; top:200px; left:80px;"></div>
<div id="time"  style="display:block; position:absolute; top:100px; left:50px;"></div>
<div style="text-align:center;">
<button id="restartGame" style="display:none; cursor:pointer; margin-right:10px;">Restart</button>
<button id="exit" style="display:none;cursor:pointer;">Exit</button>
</div>
<hi id="output"></hi>
<script>
  //Declaring variables at the top  
var chances;
var arr=[];
var randomWord=[];
var hints=[];
var usedIndexes=[];
var random, guessedWord, letters;
var currentHint="";
var alphaButtons,char,correct,found;
var winningCount=0;
var gameEnded= false;
var words=0;
var time,timeLeft,minutes,seconds;
var restart,exit;



var time=document.getElementById("timeBased");
time.addEventListener("click",timeBased);
var timeless=document.getElementById("withoutTime");
timeless.addEventListener("click",withoutTime);


//creating function for time based game
function timeBased(){

    //displaying welcome message
    document.getElementById("welcomeMessage").innerHTML="Welcome to time based ⏲️  Hangman Game<br><br><br><br>";
    //Making the hint button visible
    document.getElementById("hint").style.display="block";
    document.getElementById("chancesMessage").style.display="block";
    document.getElementById("words").style.display="block";
    //hiding all other buttons
    document.getElementById("timeBased").style.display="none";
    document.getElementById("withoutTime").style.display="none";
    //calling the function to show the keypad to the user
    showKeypad();
    //calling the function to pick up the random word
    wordsDisplay();
    startCountDown();
    
    //when hint button is clicked run the function showHint to show the hint to the user
    document.getElementById("hintButton").addEventListener("click",showHint);
}

//creating function for game without time limit
function withoutTime(){

    //displaying welcome message
    document.getElementById("welcomeMessage").innerHTML="Welcome to Hangman Game.Take your time to guess.NO TIME STRESS🥳<br><br><br><br>";
    //Making the hint button visible
    document.getElementById("hint").style.display="block";
    document.getElementById("chancesMessage").style.display="block";
    document.getElementById("words").style.display="block";
    //hiding all other buttons
    document.getElementById("timeBased").style.display="none";
    document.getElementById("withoutTime").style.display="none";
    //calling the function to show the keypad to the user
     showKeypad();
    //calling the function to pick up the random word
     wordsDisplay();
    //when hint button is clicked run the function showHint to show the hint to the user
     document.getElementById("hint").addEventListener("click",showHint);

}

//Defining the function to show the buttons to the user(keypad)
function showKeypad(){

    var alphabets=document.getElementById("alphabets");
    //creating buttons for alphabets.ASCII value of a=65 and z=90
      for(var i=65;i<=90;i++){
        //converting ASCII values to string
         letters = String.fromCharCode(i);
         alphaButtons=document.createElement("button");
        //writing letters on buttons
        alphaButtons.innerHTML=letters;
        //When the button is clicked run the function
        alphaButtons.addEventListener("click",function(){
            //change the cursor to indicate that button cannot be clicked again
            this.style.cursor="not-allowed";
        //disable the button that was clicked so user is not allowed to click it again  
            this.disabled = true;
            
            //Sending the clicked letter after converting it to lower case to another function for validation 
            
             correct= wordChecking(this.innerHTML.toLowerCase());
            //Chnging the colour of right button to green
             if(correct){
               this.style.backgroundColor= "green";
               this.style.color= "white";
             }
             //Changing the colour of wrong button to red
             else{
               this.style.backgroundColor= "red";
               this.style.color= "white";
             }
            });
            //Adding hover effect.When user move cursor it becomes hand
            alphaButtons.style.cursor="pointer";
        //setting colour of letters to blue
        alphaButtons.style.color= "blue";
        ////setting font size of letters to 20px
        alphaButtons.style.fontSize= "20px";
        //inner spacing
        alphaButtons.style.padding= "10px";
        //outer spacing
        alphaButtons.style.margin= "10px";
        //button colour
        alphaButtons.style.backgroundColor= "white";
        //shown on html page
        alphabets.appendChild(alphaButtons);
        //after displaying 9 buttons move to next line
        if(i==73 || i==82 ){
             alphabets.appendChild(document.createElement("br"));
        }
    }
    
}


//Making a function to select the random word
function wordsDisplay(){
chances=6;
document.getElementById("chancesMessage").innerHTML="chances left: "+chances+"/6";
document.getElementById("words").innerHTML="words guessed: "+winningCount+"/5";
   //Creating an array that contains words
    arr=["rainbow","sunlight","pizza","antivirus","password","reflection","earth","adventure","mountain","planet"];
    //Creating an array for hints
    hints=["Seven colours in the sky","That comes from the sun","Italian food","Protect the computers","Used for security reasons"," The image of something in a mirror or any reflective surface.","The only place to live.","An unusal,exciting or possibly dangerous activity.","A raised part of the earth's surface","Earth is the example of this."]
    //Clearing the existing text or message from the screen before showing the next word
    document.getElementById("finalMessage").innerHTML= "";
    //Making the hint button visible for the next word
    document.getElementById("hintButton").style.display="block";
    //checking if user guessed 5 words correctly then display message that user has won 
    enableButtons();
    if(winningCount == 5){
      document.getElementById("finalMessage").innerHTML+= "<br><br>" +"You have won the game";
      disableButtons();
      gameEnded = true;
      return;
    }
    //using do while loop to check that the random number generated must be different
    do{
    //creating a random number
    random= Math.floor(Math.random()*arr.length);
    console.log("The random number is: "+random);
    }while(usedIndexes.includes(random));
     usedIndexes.push(random);

    //Picking up the random word by using the random number
     randomWord=arr[random];
    //picking the hint for that random word
    currentHint= hints[random];
    console.log("Word chosen is :" +randomWord);

    //creating the blank spaces according to the length of the word..split separates the character['p','i','z','z','a'].join concatenates the characters-----
    guessedWord="-".repeat(randomWord.length).split("");
    console.log("pickWord:", guessedWord.join(""));
    document.getElementById("randomWord").innerHTML = guessedWord.join("") ;
    enableButtons();
}

//Making a function for validation
function wordChecking(char){
    
        //var char= prompt("Enter a letter");

        //if the attempts left is zero or if there in no blank space left return from here.game is over
        if(gameEnded ||  chances<=0|| !guessedWord.includes("-")){
            return false;
        }
        found=false;
        console.log(char);
        //Checking for validation
        if(randomWord.includes(char)){
            found=true;
          for(var i=0; i< randomWord.length;i++){
            if(randomWord[i]==char){
                guessedWord[i]=char;
            }
        
          console.log("correct:", guessedWord.join("")); 
          //Writing the correct letter on the screen 
          document.getElementById("randomWord").innerHTML = guessedWord.join("") ;
          }
        }
        else{
          chances--;
          console.log("Wrong guess. Attempts left",  chances);
          document.getElementById("chancesMessage").innerHTML="chances left: "+chances+"/6";
        }
//}
//Showing the final result if the player wins
if(!guessedWord.includes("-")){
    console.log("you win word was;" ,randomWord);
    document.getElementById("finalMessage").innerHTML= "<br><br>" +"You guessed the right word <br><br>  Next word is";
    winningCount++;
    document.getElementById("words").innerHTML="words guessed: "+winningCount+"/5";
    //Disable keypad during pause before loading the next word
      disableButtons();
      if(winningCount==5){
        document.getElementById("finalMessage").innerHTML= "<br><br>" +"You have won the game";
        //disableButtons();
        gameEnded=true;
        //Stop the times because game is ended
        clearInterval(time);
        showRestart();

      }
      else{
           //pause for 5 mins so player can see win message, then clear old hint and load next word
           //setTimeout schedules next word after delay but function continues execution immediately
           setTimeout(function(){
            //clear previous hint before showing the next word
            document.getElementById("hintText").innerHTML= "";
           
            //load the next random number
            wordsDisplay();
            
            
           },5000);  //5000 milliseconds = 5 seconds
           }
      }



    //Disable the buttons because the game is over
    //disableButtons();
   

//showing the final result if the player lose the game
else if(chances<=0) {
    console.log("you lose word was;" ,randomWord);
     document.getElementById("finalMessage").innerHTML = "<br><br>" +"You lose the game...The word is " +randomWord;
     //Disable the buttons because the game is over
   disableButtons();
   document.getElementById("hintButton").disabled=true;
   gameEnded=true;
   //stop the timer because game is ended
   clearInterval(time);
   showRestart();
}
//returning the value to make  a button either green or red
//return value is sent before setTimeout executes so button colour updates normally
   return found; 
}

//Defining the disable function.Making all the keys disabled after the game is over
function disableButtons(){
    var buttons=document.getElementById("alphabets").getElementsByTagName("button");
    for(var i=0;i < buttons.length;i++){
        buttons[i].disabled = true;
    }
}

//Defining the hint function.It displays the current hint associated with the random word
function showHint(){
    document.getElementById("hintText").innerHTML= currentHint;
     document.getElementById("hintButton").style.display= "none";
    
}
//Defining the enableButtons function.This function is called to make all the keys enabled after guessing the word right
function enableButtons(){
    var buttons=document.getElementById("alphabets").getElementsByTagName("button");
    for(var i=0;i < buttons.length;i++){
        buttons[i].disabled = false;
        buttons[i].style.backgroundColor="white";
        buttons[i].style.color="blue";
        buttons[i].style.cursor="pointer";


    }
}

function startCountDown(){
  //stop any previous timer before starting a new one to avoid multiple timers running together
    clearInterval(time);

    //Reset the time value to 120 seconds( 2 minutes)
    timeLeft = 120;

    //start a new countdown that runs every second
    time= setInterval(function(){
      // stopping the time immediately if game has ended or chances left is zero
      if(gameEnded || chances<=0){
        clearInterval(time);
        return;
      }

      //Continue countdown if time of 2 minutes is remaining
      if(timeLeft>=0){

        //converting total seconds into minutes and seconds
         minutes = Math.floor(timeLeft/60);
        seconds= timeLeft % 60 ;

        //add zero for single digit for seconds (:00)
        if(seconds<10){
          seconds = "0" + seconds;
        }
        console.log( minutes + ":" + seconds);
        //displaying the time on screen(m:ss)
        document.getElementById("time").innerHTML= minutes + ":" + seconds;
        //decreasing time by 1
        timeLeft--;
      }
      else{
        //stop the time
        clearInterval(time);
        //showing message on screen
        document.getElementById("finalMessage").innerHTML = "Time Over! <br> You have guessed " + winningCount +" words correct outof five words in two minutes";
       //disblae buttons because game is over
        disableButtons();
        //Marking as game is ended
        gameEnded=true;
        showRestart();
      }




    },1000); //runs every one second 1000millisecond is 1 second


}
function showRestart(){
  restart=document.getElementById("restartGame");
  //Making the restart button visible.Using inline block to make both buttons restart and exit come on one line
  restart.style.display="inLine-block";
  //When button is clicked call retartGame fuction to load the game again
  restart.addEventListener("click",restartGame);

  exit=document.getElementById("exit");
  //Making the exit button visible.Using inline block to make both buttons restart and exit come on one line
  exit.style.display="inLine-block";
  //When button is clicked call exitGame fuction to exit the game 
  exit.addEventListener("click",exitGame);
  //Making all other elements on the page invisible except final message
    document.getElementById("hint").style.display="none";
    document.getElementById("chancesMessage").style.display="none";
    document.getElementById("words").style.display="none";
    document.getElementById("time").style.display="none";
    //document.getElementById("finalMessage").style.display="none";
    document.getElementById("alphabets").style.display="none";
     document.getElementById("randomWord").style.display="none";


}
function exitGame(){
output.innerText="Thankyou for playing the game";
document.getElementById("finalMessage").style.display="none";
exit.style.display="none";
restart.style.display="none";
document.getElementById("welcomeMessage").style.display="none";

}
//Making a function to load the game again
  function restartGame(){
    
    location.reload();
    
}


</script>
