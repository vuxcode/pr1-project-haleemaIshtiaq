//Defining the function to show buttons to the user(keypad)
function showKeypad(){

  //Get the container where alphabet buttons will be added
  alphabets=document.getElementById("alphabets");
  //Loop through ASCII values (65 to 90) to generate A-Z.. A=65 and Z=90
      for(var i=65;i<=90;i++){
        //converting ASCII values to characters(means corresponding letter A-Z)
        letters = String.fromCharCode(i);
        //create a new button element dynamically
        alphaButtons=document.createElement("button");
        //display letter on button
         alphaButtons.innerHTML=letters;

        //store the letter for keyboard matching
        alphaButtons.setAttribute("data-letter",letters.toLowerCase()) ;
        
        //When the button is clicked run the function(Adding click event to each button)
        alphaButtons.addEventListener("click",function(){
        //change the cursor to indicate that button cannot be clicked again
        this.style.cursor="not-allowed";
        //disable the button that was clicked so user is not allowed to click it again to prevent the same guessess
        this.disabled = true;
        //assign the letter which is clicked to variable "char" after converting it to lower case
        char=this.innerHTML.toLowerCase();
        //Save the game data by calling saveGame function
        saveGame();
        //Sending the clicked letter after converting it to lower case to word checking function for validation 
        correct= wordChecking(this.innerHTML.toLowerCase());
          //Chnging the colour of clicked button to green if guess is correct
             if(correct){
               this.style.backgroundColor= "green";
               this.style.color= "white";
             }
          //Changing the colour of clicked button to red if guess is incorrect
             else{
               this.style.backgroundColor= "red";
               this.style.color= "white";
             }
            });
        //Adding hover effect.When user move cursor it becomes hand
        alphaButtons.style.cursor="pointer";
        //setting colour of letters to blue
        alphaButtons.style.color= "blue";
        ////setting font size of letters to 20px
        alphaButtons.style.fontSize= "20px";
        //inner spacing
        alphaButtons.style.padding= "10px";
        //outer spacing
        alphaButtons.style.margin= "10px";
        //button colour
        alphaButtons.style.backgroundColor= "white";
        //Append the created button to the alphabets container so it appears on screen
        alphabets.appendChild(alphaButtons);
        //after displaying 9 buttons move to next line

             alphabets.appendChild(document.createElement("br"));

    }

        buttons[i].style.backgroundColor="white";

function startCountDown(){
  //stop any previous timer before starting a new one to avoid multiple timers running together
    clearInterval(time);

    //Reset the time value to 120 seconds( 2 minutes)
    //timeLeft = 120;

    //start a new countdown that runs every second
    time= setInterval(function(){
      // stopping the time immediately if game has ended or chances left is zero
      if(gameEnded || chances<=0){
        //Clear time if game ended
        clearInterval(time);
        //set load to false so that the load function does not run
        load=false;
        //Saving updated values in local storage
        saveGame();
        return;
      }

      //Continue countdown if time of 2 minutes is remaining
      if(timeLeft>=0){

        //converting total seconds into minutes and seconds
         minutes = Math.floor(timeLeft/60);
        seconds= timeLeft % 60 ;

        //add zero for single digit for seconds (:00)
        if(seconds<10){
          seconds = "0" + seconds;
        }
        console.log( minutes + ":" + seconds);
        //displaying the time on screen(m:ss)
        document.getElementById("time").innerHTML= minutes + ":" + seconds;
        //decreasing time by 1
        timeLeft--;
        //Saving updated game data to local storage
        saveGame();
      }
      else{
        //Clear the local storage bacause game is ended
        localStorage.clear("storage");
        //Set load to false bacause game is ended(load function does not run)
        load=false;
        //Marking as game is ended
        gameEnded=true;
        //stop the time
        clearInterval(time);
        //Saving updated values in local storage
        saveGame();
        //showing message on screen
        document.getElementById("finalMessage").innerHTML = "Time Over! <br> You have guessed " + winningCount +" words correct outof five words in two minutes";
       //calling disabla buttons function because game is over
        disableButtons();
        //Calling showEndButtons to show restart and exit buttons
        showEndButtons();
      }
},1000); //runs every one second 1000millisecond is 1 second


}

function drawHangman(){
  
   
  //clear the whole canvas
  //ctx.clearRect(0,0,canvas.width,canvas.height);
  //set drawing color to blue
  ctx.strokeStyle="blue";
  //Set thickness for better visibility
  ctx.lineWidth=4;
  //Set rounded ends for lines
  ctx.lineCap="round";
  //Set smooth corners where lines meet
  ctx.lineJoin="round";
  if(chances==6){
  //start a new drawing path
  ctx.beginPath();
  //-----Draw base line
  //Move starting point to bottom left x axis=20, y axis=220
  ctx.moveTo(20,220);
  //Draw the horizontal base
  ctx.lineTo(100,220);

//------draw vertical pole
//move to base position x axis=60 y axis=220
 ctx.moveTo(60,220);
 //Draw vertical line upwards
  ctx.lineTo(60,60);

//-----draw top horizontal line
//Draw horizontal line to the right
  ctx.lineTo(120,60);

//Draw rope(small vertical line downward)
  ctx.lineTo(120,90);
  //draw all lines on canvas
ctx.stroke();
  }

//if 1 mistake make head
  else if(chances==5){
//new drawing path
  ctx.beginPath();
  //make circle(head)
  ctx.arc(120,110,20,0,2*Math.PI);
  //Draw circle on canvas
  ctx.stroke();
  }

  // if 2 mistakes make body also
  else if(chances==4){
  //head center is(120,110) radius(20) so bottom of head is(110+20=130)so body starts at (120,130)
  //code for body
  ctx.beginPath();
  //start at belew head
  ctx.moveTo(120,130);
  //Go straight down
  ctx.lineTo(120,190);
  //draw the body now
  ctx.stroke();
  }

  //3 mistakes make left arm also
  else if(chances==3){
//code for left arm
ctx.beginPath();
  ctx.moveTo(120,150);
  //down left
  ctx.lineTo(90,170);
  ctx.stroke();
  }

  //if 4 mistakes make right arm also
  else if(chances==2){
//code for right arm
ctx.beginPath();
//same point as left arm
  ctx.moveTo(120,150);
  //down right
  ctx.lineTo(150,170);
  ctx.stroke();
  }

  //if 5 mistakes make left leg
  else if(chances==1){
    console.log("in chances 1");
  //code for left leg
  ctx.beginPath();
  //bottom point of body
  ctx.moveTo(120,190);
  //down left
  ctx.lineTo(90,210);
  ctx.stroke();
  }

  //if 6 mistakes make right leg also.Now hangman complete (Game over)
  else if (chances==0) {
    console.log("in chances 0");
  //code for right leg
  ctx.beginPath();
  //bottom of the body
  ctx.moveTo(120,190);
  //down right
  ctx.lineTo(150,210);
  ctx.stroke();

}
}

//Function for restoring keypad button colours(green and red) and states(disabled) after refresh
function recolouringKeypad(){
//Getting all alphabet buttons from keypad.
//Using querySelectorAll which do the following steps
//Find element with id "alphabets"
//Then select all <button>elements inside it
//Store them in reusedButtons 
reusedButtons=document.querySelectorAll("#alphabets button");
for(var i=0;i<reusedButtons.length;i++){
 //Checking if button belongs to correctly guessed letters 
if(correctButtons.includes(reusedButtons[i].innerHTML.toLocaleLowerCase())){
//Restoring current button style  
reusedButtons[i].style.backgroundColor="green";
reusedButtons[i].style.color= "white";
reusedButtons[i].style.border= "none";
//Disabling used correct button to keep game state same after refresh
reusedButtons[i].disabled=true;
//Changing cursor to keep button appearance same after refresh
reusedButtons[i].style.cursor="not-allowed"
}
//Checking if button belongs to wrongly guessed letters 
if(wrongButtons.includes(reusedButtons[i].innerHTML.toLowerCase())){
  //Restoring wrong button style  
  reusedButtons[i].style.backgroundColor="red";
  reusedButtons[i].style.color= "white";
  reusedButtons[i].style.border= "none";
  //Disabling used wrong button to keep game state same after refresh
  reusedButtons[i].disabled=true;
  //Changing cursor to keep button appearance same after refresh
  reusedButtons[i].style.cursor="not-allowed"
}
}

}
